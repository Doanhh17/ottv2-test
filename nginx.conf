worker_processes auto;
worker_rlimit_nofile 16384;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    server_tokens off;
    client_max_body_size 110k;

    map $arg_round_no $round_file {
        default "";
        1 "round_1.json";
        2 "round_2.json";
        3 "round_3.json";
        4 "round_4.json";
        5 "round_5.json";
    }

    upstream ottv2_api {
        server api:8000;
        keepalive 64;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain text/xml;

    server {
        listen 80;
        server_name _;
        etag on;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        location = /api/leaderboard/daily {
            rewrite ^ /leaderboards/daily.json last;
        }

        location = /api/leaderboard/tournament {
            rewrite ^ /leaderboards/tournament.json last;
        }

        location = /api/leaderboard/round {
            if ($round_file = "") { return 404; }
            rewrite ^ /leaderboards/$round_file last;
        }

        location ^~ /leaderboards/ {
            alias /srv/ottv2/static/leaderboards/;
            default_type application/json;
            add_header Cache-Control "public, max-age=60, must-revalidate" always;
            access_log off;
        }

        location ^~ /static/ {
            alias /srv/ottv2/static/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
            access_log off;
        }

        location / {
            proxy_pass http://ottv2_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}